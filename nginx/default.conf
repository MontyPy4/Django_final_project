# Upstream — gunicorn в контейнере web на порту 8000.
upstream django_app {
    server web:8000;
}

# HTTP → HTTPS редирект.
server {
    listen 80 default_server;
    server_name _;

    # Allow ACME-challenge для будущего Let's Encrypt (если понадобится).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Современные SSL-настройки.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Защитные заголовки.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Размер загружаемого тела (на будущее под Pillow/image upload).
    client_max_body_size 20M;

    # Статика — отдаётся nginx напрямую с volume.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Медиафайлы (если появятся пользовательские загрузки).
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Всё остальное — проксируется в gunicorn.
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_buffering on;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
